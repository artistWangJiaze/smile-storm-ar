[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/wasm/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/effects/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
