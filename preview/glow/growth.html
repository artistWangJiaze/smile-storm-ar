<h1>前段修改：整体缩放 + 内部绽放</h1><p>左：原来的整体缩放。右：相同缩放速度，同时花瓣舒展、粒子逐渐外喷。只检查前 0.85 秒；后段衔接尚未修改。</p>
<button id="play">暂停</button><button id="restart">从头播放</button><select id="speed"><option value="0.35">慢速 0.35×</option><option value="1">原速 1×</option></select><button id="background">切换亮底</button>
<div><input id="seek" type="range" min="0" max="0.85" step="0.001" value="0"><output id="time"></output></div>
<div class="pair"><div><h2>原版 · 只有缩放</h2><div id="old" class="stage"></div></div><div><h2>新版 · 缩放同时绽放</h2><div id="new" class="stage"></div></div></div>
