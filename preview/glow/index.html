<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/favicon.svg"><title>烟花光效 · 实时预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121418;color:#f0f1f3;font:15px/1.5 system-ui,sans-serif}main{max-width:1020px;margin:auto;padding:24px}header{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}h1{font-size:22px;font-weight:600;margin:0}header p{color:#a5abb5;margin:0}#stage{width:min(100%,680px);aspect-ratio:1;margin:20px auto;background:#000;position:relative;overflow:hidden;border-radius:8px}#mount,#camera{position:absolute;inset:0;width:100%;height:100%}#camera{object-fit:cover;transform:scaleX(-1);display:none}#mount canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}#stage.light{background:#b6b9bf}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button,select{font:inherit;color:inherit;background:#242931;border:1px solid #444c58;border-radius:7px;padding:8px 14px;cursor:pointer}button:hover{border-color:#a0b0c0}button[aria-pressed=true]{background:#334c5e;border-color:#88bdde}#timeline{display:flex;align-items:center;gap:14px;margin:16px auto;max-width:680px}input{flex:1;accent-color:#78c4f2}output{font-variant-numeric:tabular-nums;min-width:5em}#status{text-align:center;color:#adb8c5;min-height:24px;margin:12px 0}footer{text-align:center;color:#9aa4b1;font-size:14px}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #8dccec;outline-offset:3px}@media(max-width:520px){main{padding:14px}header p{font-size:14px}button,select{padding:7px 10px}}
</style></head><body><main>
<header><h1>烟花光效 · 实时预览</h1><p>代码实时渲染 / 未替换正式版</p></header>
<p><a href="./target.html" style="color:#a9d8ff;font-weight:600">查看最新：黑底目标帧小样 →</a></p>
<div id="stage"><video id="camera" muted playsinline></video><div id="mount"></div></div>
<div class="controls" role="group" aria-label="合成效果对比"><button id="current" aria-pressed="false">A · 上一版</button><button id="colour-glow" aria-pressed="true">B · 保色发光试验</button></div>
<p id="comparison" style="text-align:center;color:#c6d3e0">B · 彩色粒子局部覆盖背景，再叠加光效；不压暗整幅画面。</p>
<div class="controls"><button id="play">暂停</button><button id="restart">重新绽放</button><select id="palette" aria-label="纹饰配色"><option value="0">粉金纹饰</option><option value="1">蓝紫纹饰</option><option value="2">青金纹饰</option></select><button id="black" aria-pressed="true">黑底</button><button id="light" aria-pressed="false">亮底</button><button id="webcam">摄像头背景</button></div>
<div id="timeline"><input id="seek" aria-label="动画进度" type="range" min="0" max="3.6" step="0.0166667" value="0"><output id="time">0.00 秒</output></div>
<p id="status">正在载入纹饰…</p><footer>可暂停或拖动查看初绽放、扩散与消散。摄像头仅在点击后开启，画面不上传。</footer>
</main><script type="module" src="./main.ts"></script></body></html>
